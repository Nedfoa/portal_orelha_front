<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orelha | Pets</title>
    <link rel="stylesheet" href="./informacao_pets.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<body>
    

    
        <header class="cabecalho">

            <a href="#" class="logo">
                <img src="../img/LogoSite.png" alt="Orelha">
            </a>

            <nav class="menu">

                <a href="#">Início</a>
                <a href="#">Perfil</a>
                <a href="#">ONG</a>
                <a href="#">Ajudar</a>
                <a href="#" class="botao-adotar"><i class="fa-regular fa-heart"></i>Adotar</a>

            </nav>

        </header>

          <main>

            

        <section class="informacao-container">

            <!-- Lado esquerdo -->

            <div class="informacoes esquerda">

                <div class="informacao">
                    <span>Nome</span>
                    <strong id="nomePet">Hércules</strong>
                </div>

                <div class="informacao">
                    <span>Idade</span>
                    <strong id="idadePet">2 anos</strong>
                </div>

                <div class="informacao">
                    <span>Raça</span>
                    <strong id="racaPet">SRD</strong>
                </div>

            </div>


            <!-- Card -->
            <div class="area-card">

                <a href="favoritos.html" class="icone-coracao">
                    <i class="fa-solid fa-heart"></i>
                </a>

                <div class="icone-pata">
                    <i class="fa-solid fa-paw"></i>
                </div>


                <div class="card-pet">

                    <img
                        id="imagemPet"
                        src="../img/dogUm.png"
                        alt="Hércules"
                        class="imagem-pet"
                    >

                    <div class="botao-conhecer">
                        <button id="conhecerMais"> Conhecer mais</button>
                    </div>

                </div>

            </div>


            <!-- Lado direito-->

            <div class="informacoes direita">

                <div class="informacao">
                    <span>Sexo</span>
                    <h4 id="sexoPet">Masculino</h4>
                </div>

                <div class="informacao">
                    <span>Personalidade</span>
                    <h4 id="personalidadePet">brincalhão</h4>
                </div>

                <div class="informacao">
                    <span>Porte</span>
                    <h4 id="portePet">Grande</h4>
                </div>

            </div>

        </section>


        <!-- Botão de ir e vir -->

        <div class="navegacao">

            <button id="voltar">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <button id="proximo">
                <i class="fa-solid fa-chevron-right"></i>
            </button>

        </div>

    </main>


<div class="transicao-pagina"></div>


        <script src="./informacao_pets.js"></script>
</body>
</html>
