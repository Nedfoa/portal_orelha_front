<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orelha | Pets</title>
    <link rel="stylesheet" href="./catalogo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<body>

    <header class="cabecalho">

        <a href="#" class="logo">
            <img src="../img/LogoSite.png" alt="Orelha">
        </a>

        <nav class="menu">

            <a href="#">Início</a>
            <a href="#">Perfil</a>
            <a href="#">ONG</a>
            <a href="#">Ajudar</a>
            <a href="#" class="botao-adotar"><i class="fa-regular fa-heart"></i>Adotar</a>

        </nav>

    </header>


    <main>

        <div class="cabecalho-catalogo">
            <div class="titulo">
                <h1>Conheça nossos pets</h1>
                <p> Cada um tem uma história, e todos merecem um lar</p>
            </div>

            <div class="filtro">
                <button onclick="abrirFiltro()">
                    <span id="textoFiltro">Todos</span>
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div id="opcoes">
                    <button onclick="selecionarFiltro('Todos')">Todos</button>
                    <button onclick="selecionarFiltro('Cachorro')">Cachorro</button>
                    <button onclick="selecionarFiltro('Gato')">Gato</button>
                </div>
            </div>

        </div>




        
        
        <section class="catalogo">

            <!-- CARD 1 -->
            <div class="card-pet cachorro" onclick="abrirPet(0)">

                <a href="favoritos.html" class="icone-coracao">
                    <i class="fa-solid fa-heart"></i>
                </a>

                <div class="icone-pata">
                    <i class="fa-solid fa-paw"></i>
                </div>

                <img src="../img/dogUm.png" class="imagem-pet">

                <div class="informacao-pet">
                    <span>Hércules</span>
                </div>  

            </div>
