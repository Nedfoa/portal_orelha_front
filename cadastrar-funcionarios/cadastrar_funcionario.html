<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./cadastrar_funcionario.css">

    <title>Cadastrar Funcionários</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main class="container">

        <!-- LADO ESQUERDO -->
        <section class="cadastro">

            <!-- DECORAÇÃO -->
            <i class="fa-solid fa-paw patinha-esquerda"></i>

            <div class="titulo-cadastro">

                <i class="fa-solid fa-paw"></i>

                    <h1>CRIAR CONTA</h1>


            </div>


            <form id="formCadastro">

                <div class="input-box">

                    <label for="nome">Nome completo</label>

                    <div class="campo">

                        <input 
                            type="text" 
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome completo"
                            autocomplete="name"
                            required
                        >

                        <i class="fa-regular fa-user"></i>

                    </div>

                </div>

                <div class="input-box">

                    <label for="email">Email</label>

                    <div class="campo">

                        <input 
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu email"
                            autocomplete="email"
                            required
                        >

                        <i class="fa-regular fa-envelope"></i>

                    </div>

                </div>

                <div class="input-box">

                    <label for="cpf">CPF</label>

                    <div class="campo">

                        <input 
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="000.000.000-00"
                            maxlength="14"
                            inputmode="numeric"
                            autocomplete="off"
                            required
                        >

                        <i class="fa-solid fa-users"></i>

                    </div>

                </div>

                <div class="input-box">

                    <label for="telefone">Telefone</label>

                    <div class="campo">

                        <input 
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="Digite seu telefone"
                            maxlength="11"
                            inputmode="numeric"
                            autocomplete="tel"
                            required
                        >

                        <i class="fa-solid fa-phone"></i>

                    </div>

                </div>

                <div class="input-box">

                    <label for="data_nascimento">Data de nascimento</label>

                    <div class="campo">

                        <input 
                            type="date"
                            id="data_nascimento"
                            name="data_nascimento"
                            required
                        >

                        <i class="fa-solid fa-calendar-days"></i>

                    </div>

                </div>

                <div class="input-box">

                    <label for="senha">Senha</label>

                    <div class="campo">

                        <input 
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            minlength="8"
                            maxlength="30"
                            autocomplete="new-password"
                            required
                        >

                        <i class="fa-solid fa-lock"></i>

                    </div>

                </div>


                <p id="mensagem"></p>


                <button type="submit">
                    <i class="fa-solid fa-paw"></i>
                    Cadastrar
                </button>

            </form>

        </section>

       
        <section class="bem-vindo">

            <i class="fa-solid fa-paw patinha-topo"></i>

            <div class="titulo-bem-vindo">

                <div class="icone-coracao">
                    <i class="fa-solid fa-paw"></i>
                     
                </div>

                <h1>BEM-VINDO!</h1>

            </div>


            <p>Ficamos felizes por ter<br>você aqui. Esperamos que<br>encontre o seu mais novo<br>amigo!</p>


            <div class="login">

                <h2>Já tem uma conta?</h2>
                <a href="../login/login.html"><button type="button">Já tem uma conta?</button></a>

            </div>


            <div class="animais">
                <img src="" alt="">
            </div>

            <i class="fa-solid fa-paw patinha-baixo"></i>

        </section>

    </main>


    <script src="./cadastrar_funcionario.js"></script>

</body>

</html>
