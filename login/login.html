<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="/_vercel/insights/script.js"></script>
    <link rel="stylesheet" href="../CSS/login.css">
    <title>Login</title>
    <meta
      name="description"
      content="High-performance HTML based website template."
    />
    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>
  <body>
     <main class="container">

        <!-- LADO ESQUERDO -->
        <section class="login">

            <h1> LOGIN</h1>

            <form>

                <div class="input-box">
                    <label>CPF</label>

                    <div class="campo">
                        <input type="text">
                        <i class="fa-solid fa-users"></i>
                    </div>
                </div>


                <div class="input-box">
                    <label>Senha</label>

                    <div class="campo">
                        <input type="password">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>



                <button type="submit">
                    Login
                </button>


                

            </form>

        </section>


        <!-- LADO DIREITO -->
        <section class="bem-vindo">

            <h1>BEM-VINDO!</h1>

            <p>
                Ficamos felizes por ter você de volta!
            </p>


            <div class="cadastro">

                <h2>Ainda não tem uma conta?</h2>

                <button>
                    <a href="../cadastro-cliente/index.html" class="login-link">Clique aqui!</a>
                </button>

            </div>

        </section>

    </main>

  </body>
</html>
