<!DOCTYPE html>
<html lang="en">
  <head>

                <div class="input-box">

                </div>


                <div class="input-box">
                    <label>Email</label>

                    <div class="campo">
                        <input type="email">

                    </div>
                </div>


                <div class="input-box">
                    <label>CPF</label>

                    <div class="campo">
                        <input type="text">
                        <i class="fa-solid fa-users"></i>
                    </div>
                </div>


                <div class="input-box">
                    <label>Senha</label>

                    <div class="campo">
                        <input type="password">

                </div>

                <div class="input-box">

                </div>

                <div class="input-box">
                    <label>Senha</label>

                    <div class="campo">
                        <input type="password">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>



                <button type="submit">
                    Cadastrar
                </button>


                

            </form>

        </section>


        <!-- LADO DIREITO -->

            <h1>BEM-VINDO!</h1>

                Ficamos felizes por ter<br>

                encontre o seu mais novo<br>
                amigo!
            </p>


            <div class="login">

                <h2>Já tem uma conta?</h2>

                <button>
                    Clique aqui!
                </button>

                <div class="ou">
                    <span></span>
                    <strong>ou</strong>
                    <span></span>
                </div>

                <a href="#">
                    Sou funcionário
                </a>

            </div>

        </section>

    </main>

</html>
